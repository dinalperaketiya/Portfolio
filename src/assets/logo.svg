<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Badge -->
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bgGradient)" />
  <rect x="10" y="10" width="180" height="180" rx="44" fill="none" stroke="url(#logoGradient)" stroke-width="4" opacity="0.6" />
  
  <!-- Stylized Hexagon / Code Shield -->
  <path d="M100 40 L155 70 L155 130 L100 160 L45 130 L45 70 Z" fill="none" stroke="url(#logoGradient)" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Code Brackets & Slash -->
  <path d="M82 82 L65 100 L82 118" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M118 82 L135 100 L118 118" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="106" y1="78" x2="94" y2="122" stroke="url(#logoGradient)" stroke-width="7" stroke-linecap="round" />
</svg>
